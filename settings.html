<div id="st_studio_settings">
  <div class="inline-drawer">
    <div class="inline-drawer-toggle inline-drawer-header">
      <b>ST Studio</b>
      <div
        class="inline-drawer-icon fa-solid fa-circle-chevron-down down"
      ></div>
    </div>
    <div class="inline-drawer-content">
      <label class="checkbox_label" for="st-studio-enabled">
        <input id="st-studio-enabled" type="checkbox" />
        <span>Enabled</span>
      </label>

      <label class="checkbox_label" for="st-studio-post-processing">
        <input id="st-studio-post-processing" type="checkbox" />
        <span>Post-processing</span>
      </label>

      <div class="flex-container flexFlowColumn">
        <label for="st-studio-server-base">
          <span>Server base URL</span> <small>(optional)</small>
        </label>
        <input
          id="st-studio-server-base"
          class="text_pole"
          type="text"
          placeholder="http://127.0.0.1:8000"
        />
        <small>Leave empty to use the current origin.</small>
      </div>

      <div class="flex-container alignItemsCenter marginTop5">
        <div
          id="st-studio-ping"
          class="menu_button menu_button_icon"
          title="Ping ST Studio state endpoint"
        >
          <i class="fa-solid fa-signal"></i>
          <span>Ping state</span>
        </div>
        <span class="flex1"></span>
        <small>Result: <span id="st-studio-ping-result">-</span></small>
      </div>
    </div>
  </div>
</div>
